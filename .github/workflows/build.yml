name: Build Android APK (LIOS Classic)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  buildWithUnity:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # 1. Repository Clone
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          lfs: true

      # 2. Unity Project Library Caching (Build Fast Karne Ke Liye)
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-

      # 3. Unity Engine Android Build Action
      - name: Build Unity Project (Android APK)
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: LIOS_Classic_F2W
          buildsPath: build/Android

      # 4. APK File Upload As Artifact (Download Link Generator)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LIOS-Classic-Android-APK
          path: build/Android/LIOS_Classic_F2W.apk
