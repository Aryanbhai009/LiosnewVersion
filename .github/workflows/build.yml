name: Build Android APK (LIOS Classic)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  buildWithUnity:
    name: Build Android APK Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-Android-

      - name: Unity Auto-Login & Build
        uses: game-ci/unity-builder@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          buildName: LIOS_Classic_1GB
          buildsPath: build/Android
          unityVersion: 2022.3.20f1
          androidAppBundle: false

      - name: Upload APK
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: LIOS-Classic-Android-APK
          path: build/Android/
