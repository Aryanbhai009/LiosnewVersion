name: Build Android APK (LIOS Classic)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-

      - name: Unity Android Builder
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildName: LIOS_Classic_1GB
          buildsPath: build/Android
          unityVersion: 2022.3.20f1
          allowExecution: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: LIOS-Classic-Android-APK
          path: build/Android/
