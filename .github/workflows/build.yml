name: Build Android APK (LIOS Classic)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Unity Project
        uses: game-ci/unity-builder@v2
        with:
          targetPlatform: Android
          buildName: LIOS_Classic_F2W
          buildsPath: build/Android
          unityVersion: 2022.3.20f1
          customParameters: -quit -batchmode -nographics -noUpm

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: LIOS-Classic-Android-APK
          path: build/Android/LIOS_Classic_F2W.apk
